services:
  redis:
    image: redis:7-alpine
    container_name: ulpin_redis

  db:
    image: postgis/postgis:latest
    container_name: ulpin_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASS:-AdminSuperPassword}
      POSTGRES_DB: ulpin_db
    volumes:
      - mimi-postgis-data:/var/lib/postgresql/data
      - ./scripts/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./src/mimi/schema.sql:/docker-entrypoint-initdb.d/02_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ulpin_db"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 45s

  api:
    build: .
    image: hexcode-backend:latest
    container_name: ulpin_api
    command: uv run uvicorn src.mimi.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://ulpin_worker:SuperSecretStrongPassword@db:5432/ulpin_db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      HEXCODE_SALT: ${HEXCODE_SALT:-b9a7f3c4e1d20984a6b5c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    image: hexcode-backend:latest
    container_name: ulpin_worker
    command: uv run celery -A src.mimi.worker.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://ulpin_worker:SuperSecretStrongPassword@db:5432/ulpin_db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      HEXCODE_SALT: ${HEXCODE_SALT:-b9a7f3c4e1d20984a6b5c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8}
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  mimi-postgis-data: