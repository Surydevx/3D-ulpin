[project]
name = "mimi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Surydevx", email = "219320689+Surydevx@users.noreply.github.com" }
]
requires-python = ">=3.12, <3.13"
dependencies = [
    "asyncio>=4.0.0",
    "celery>=5.6.3",
    "fastapi>=0.141.1",
    "geopandas>=1.1.4",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "open3d>=0.19.0",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "scikit-learn>=1.9.0",
    "shapely>=2.1.2",
    "sqlalchemy>=2.0.52",
    "ultralytics>=8.4.130",
    "uvicorn>=0.52.4",
]

[project.scripts]
mimi = "mimi:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
